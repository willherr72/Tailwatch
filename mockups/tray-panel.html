<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tailwatch — tray concept</title>
<style>
*{box-sizing:border-box}
body{margin:0;color:var(--foreground);font-family:var(--font-sans, "Segoe UI", sans-serif);font-size:13px}
button,input,select{font:inherit;color:inherit}
button,select{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
button{border:0;background:none}
.stage{max-width:600px;margin:0 auto;padding-top:8px}
.panel-space{height:563px;display:flex;align-items:flex-end;padding-bottom:12px}
.panel{width:100%;height:551px;display:flex;flex-direction:column;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius,16px);padding:16px;box-shadow:0 12px 36px color-mix(in srgb,var(--foreground) 8%,transparent);overflow:hidden}
.panel[hidden]{display:none}
.top{display:flex;align-items:center;gap:10px;padding-bottom:15px}
.logo{display:grid;place-items:center;width:34px;height:34px;background:var(--accent-surface,var(--secondary));color:var(--chart-2);border:1px solid var(--border);border-radius:10px}
svg{display:block}
h1{font-size:17px;letter-spacing:-.45px;margin:0;font-weight:650}
.sub{font-size:11px;color:var(--muted-foreground);margin-top:3px}
.badge{margin-left:auto;font-size:10px;letter-spacing:.7px;border:1px solid var(--border);border-radius:6px;padding:4px 6px;color:var(--muted-foreground)}
.close{color:var(--muted-foreground);font-size:21px;padding:2px 6px}
.toolbar{display:flex;gap:9px;padding-bottom:13px}
.search{flex:1;min-width:0;position:relative}
.search svg{position:absolute;top:10px;left:10px;color:var(--muted-foreground)}
input{width:100%;background:var(--secondary);border:1px solid var(--border);border-radius:8px;padding:9px 9px 9px 32px;outline:none;font-size:12px}
select{max-width:145px;border:1px solid var(--border);background:var(--secondary);border-radius:8px;padding:7px;font-size:12px}
.fleet-meta{display:flex;align-items:center;gap:6px;color:var(--muted-foreground);font-size:11px;padding-bottom:9px}
.dot{display:inline-block;width:6px;height:6px;background:var(--success);border-radius:50%;flex-shrink:0}
.fleet-meta .hint{margin-left:auto}
.machines{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;padding-right:3px}
.machine{border-top:1px solid var(--border)}
summary{list-style:none;cursor:pointer;padding:14px 2px}
summary::-webkit-details-marker{display:none}
summary:hover{background:color-mix(in srgb,var(--secondary) 50%,transparent)}
.row-top{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.device-icon{color:var(--muted-foreground);display:flex;align-items:center}
.name{font-size:13px;font-weight:600;letter-spacing:-.15px}
.os{font-size:10px;color:var(--muted-foreground);margin-left:1px}
.state{margin-left:auto;font-size:10px;color:var(--muted-foreground)}
.chevron{color:var(--muted-foreground);transition:transform .15s}
details[open] .chevron{transform:rotate(90deg)}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.metric-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.metric-label{font-size:10px;letter-spacing:.4px;color:var(--muted-foreground)}
.value{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.unit{font-size:10px;font-weight:400;margin-left:1px;color:var(--muted-foreground)}
.track{height:4px;border-radius:3px;background:var(--secondary);overflow:hidden}
.fill{height:100%;background:var(--chart-2);border-radius:3px;transition:width .35s}
.warm .fill{background:var(--warning)}
.hot .fill{background:var(--destructive)}
.hot .value{color:var(--destructive)}
.offline .dot{background:var(--muted-foreground)}
.offline .name,.offline .value{color:var(--muted-foreground)}
.detail{background:var(--secondary);padding:12px;border-radius:9px;margin:0 2px 12px;font-size:11px}
.detail-line{display:flex;justify-content:space-between;gap:12px;padding:4px 0;line-height:1.5}
.detail-line span:first-child{color:var(--muted-foreground)}
.detail-line span:last-child{text-align:right}
.detail-note{font-size:10px;color:var(--muted-foreground);line-height:1.6;border-top:1px solid var(--border);margin-top:8px;padding-top:8px}
.empty{padding:40px 10px;text-align:center;color:var(--muted-foreground)}
.footer{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-top:12px;border-top:1px solid var(--border);font-size:10px;color:var(--muted-foreground)}
.footer button{font-size:11px;border-radius:6px;padding:5px 8px;background:var(--secondary)}
.taskbar{display:flex;align-items:center;justify-content:flex-end;gap:15px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius,12px);padding:16px;min-height:67px}
.taskbar .taskbar-label{margin-right:auto;font-size:10px;color:var(--muted-foreground)}
.tray{display:grid;place-items:center;width:35px;height:34px;border-radius:7px;color:var(--chart-2);background:var(--secondary);border:1px solid var(--border)}
.tray[aria-expanded="false"]{background:transparent}
.clock{font-variant-numeric:tabular-nums;text-align:right;font-size:12px;line-height:1.6}
.clock small{color:var(--muted-foreground);font-size:10px}
.instructions{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:11px 0 6px;color:var(--muted-foreground);font-size:11px;line-height:1.5}
.instructions button{color:var(--foreground);white-space:nowrap;font-size:11px;text-decoration:underline;text-underline-offset:3px}
@media(max-width:420px){.meters{gap:16px}.os{display:none}.taskbar{gap:11px}.hint{display:none}.name{font-size:12px}.panel{padding:13px}.detail-line{gap:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="stage">
<div class="panel-space">
<section class="panel" id="panel" aria-label="Tailwatch machines">
<header class="top">
<div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17V12M9 17V6M15 17V10M21 17V3"/></svg></div>
<div><h1>Tailwatch</h1><div class="sub">Your machines, at a glance</div></div>
<span class="badge">MOCKUP</span><button class="close" id="close" aria-label="Close tray panel">&times;</button>
</header>
<div class="toolbar">
<label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="search" type="search" placeholder="Find a machine…" aria-label="Find a machine"></label>
<select id="sort" aria-label="Sort machines"><option value="name">Sort: Name</option><option value="cpu">Sort: CPU</option><option value="gpu">Sort: GPU</option><option value="ram">Sort: RAM</option></select>
</div>
<div class="fleet-meta"><span class="dot"></span><span>3 online</span><span>· 1 offline</span><span class="hint">Click a machine for details</span></div>
<div class="machines" id="machines"></div>
<footer class="footer"><span id="updated" role="status">Sample readings · no devices connected</span><button id="reset">Reset demo</button></footer>
</section>
</div>
<div class="taskbar" aria-label="Simulated Windows system tray">
<span class="taskbar-label">SYSTEM TRAY</span>
<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 10 5-5 5 5"/></svg>
<button id="tray" class="tray" aria-label="Toggle Tailwatch panel" aria-controls="panel" aria-expanded="true" title="Tailwatch · 3 machines online"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 17V12M9 17V6M15 17V10M21 17V3"/></svg></button>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4M8 21h8"/></svg>
<div class="clock">8:37 AM<br><small>11/3/2026</small></div>
</div>
<div class="instructions"><span>Sample data. Try the tray icon, sorting, and machine details.</span><button id="simulate">Simulate update ↻</button></div>
</main>
<script>
const initial=[
{id:'linux',name:'GPU workstation',os:'Linux',cpu:54,gpu:92,ram:78,online:true,processor:'AMD Ryzen 9 · 24 threads',memory:'50 / 64 GB',gpus:[{name:'NVIDIA RTX 4090',use:92,vram:'21.6 / 24 GB'},{name:'NVIDIA RTX 3090',use:36,vram:'8.2 / 24 GB'}]},
{id:'mac',name:'Mac Studio',os:'macOS',cpu:26,gpu:11,ram:61,online:true,processor:'Apple M2 Max · 12 cores',memory:'39 / 64 GB unified',gpus:[{name:'Apple M2 Max · 38 GPU cores',use:11,vram:null}]},
{id:'windows',name:'Windows desktop',os:'Windows',cpu:8,gpu:4,ram:42,online:true,processor:'Intel Core i7 · 20 threads',memory:'13.4 / 32 GB',gpus:[{name:'NVIDIA RTX 4070',use:4,vram:'1.3 / 12 GB'}]},
{id:'offline',name:'Build server',os:'Linux',cpu:null,gpu:null,ram:null,online:false}
];
let machines=structuredClone(initial);
let openIds=new Set();
const list=document.getElementById('machines');
const panel=document.getElementById('panel');
const tray=document.getElementById('tray');
const escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function meter(label,value){
const type=value>=90?'hot':value>=75?'warm':'';
return '<div class="metric '+type+'"><div class="metric-head"><span class="metric-label">'+label+'</span><span class="value">'+(value===null?'—':value+'<span class="unit">%</span>')+'</span></div><div class="track" '+(value===null?'aria-label="'+label+' unavailable"':'role="meter" aria-label="'+label+' utilization" aria-valuenow="'+value+'" aria-valuemin="0" aria-valuemax="100"')+'><div class="fill" style="width:'+(value===null?0:value)+'%"></div></div></div>';
}
function detail(m){
if(!m.online)return '<div class="detail">Last seen 18 minutes ago.<div class="detail-note">Current utilization is unavailable until this machine reconnects.</div></div>';
let content='<div class="detail-line"><span>CPU</span><span>'+escapeHtml(m.processor)+'</span></div><div class="detail-line"><span>Memory in use</span><span>'+escapeHtml(m.memory)+'</span></div>';
m.gpus.forEach(g=>{
content+='<div class="detail-line"><span>'+escapeHtml(g.name)+'</span><span>'+g.use+'% active</span></div>';
if(g.vram)content+='<div class="detail-line"><span>Video memory in use</span><span>'+escapeHtml(g.vram)+'</span></div>';
});
const note=m.id==='mac'?'CPU and GPU share unified memory. GPU activity shows how much of the sample interval the GPU was active.':m.gpus.length>1?'The GPU figure in the list shows the busiest GPU. Each GPU is listed separately here.':'GPU activity and video memory usage are separate readings.';
return '<div class="detail">'+content+'<div class="detail-note">'+note+'</div></div>';
}
function render(){
const query=document.getElementById('search').value.trim().toLowerCase();
const sort=document.getElementById('sort').value;
const shown=machines.filter(m=>(m.name+' '+m.os+' '+(m.gpus||[]).map(g=>g.name).join(' ')).toLowerCase().includes(query));
shown.sort((a,b)=>Number(b.online)-Number(a.online)||(sort==='name'?a.name.localeCompare(b.name):(b[sort]??-1)-(a[sort]??-1))||a.name.localeCompare(b.name));
list.innerHTML=shown.length?shown.map(m=>'<details class="machine '+(m.online?'':'offline')+'" data-id="'+m.id+'" '+(openIds.has(m.id)?'open':'')+'><summary><div class="row-top"><span class="dot" aria-hidden="true"></span><span class="name">'+escapeHtml(m.name)+'</span><span class="os">'+m.os+'</span><span class="state">'+(m.online?'':'Offline · 18m')+'</span><svg class="chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 2 4 4-4 4"/></svg></div><div class="meters">'+meter('CPU',m.cpu)+meter('GPU',m.gpu)+meter('RAM',m.ram)+'</div></summary>'+detail(m)+'</details>').join(''):'<div class="empty">No matching machines.</div>';
list.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{if(d.open)openIds.add(d.dataset.id);else openIds.delete(d.dataset.id)}));
}
function setPanel(open){panel.hidden=!open;tray.setAttribute('aria-expanded',String(open))}
tray.addEventListener('click',()=>setPanel(panel.hidden));
document.getElementById('close').addEventListener('click',()=>{setPanel(false);tray.focus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){setPanel(false);tray.focus()}});
document.getElementById('search').addEventListener('input',render);
document.getElementById('sort').addEventListener('change',render);
let updateCount=0;
document.getElementById('simulate').addEventListener('click',()=>{
updateCount++;
machines.filter(m=>m.online).forEach((m,i)=>{
m.cpu=Math.max(1,Math.min(100,m.cpu+(updateCount%2===1?1:-1)*(i+2)));
m.gpus.forEach((g,j)=>g.use=Math.max(1,Math.min(100,g.use+(updateCount%2===1?-1:1)*(j+2))));
m.gpu=Math.max(...m.gpus.map(g=>g.use));
});
render();
document.getElementById('updated').textContent='Simulated update '+updateCount+' · sample data';
});
document.getElementById('reset').addEventListener('click',()=>{
machines=structuredClone(initial);openIds.clear();updateCount=0;
document.getElementById('search').value='';document.getElementById('sort').value='name';
document.getElementById('updated').textContent='Sample readings · no devices connected';render();
});
render();
</script>
</body>
</html>
